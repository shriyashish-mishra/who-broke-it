name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: test -z "$(gofmt -l .)"
      - run: make test
      - run: make demo
      - run: make demo-team
      - run: make cross
